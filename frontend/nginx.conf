# Serves the built SPA and reverse-proxies /api to the backend, so the browser talks to one origin
# (no CORS). TLS would terminate in front of this in a real deployment.

upstream api {
  server api:8080;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Appends the real client IP; the API trusts only this proxy's network and reads the last hop,
    # so a client-supplied X-Forwarded-For can't spoof its rate-limit identity.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # Hashed build assets never change: cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # index.html must always be revalidated so new deploys are picked up.
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
