version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node runtime we target (.nvmrc / engines), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript majors (e.g. the native TS 7 compiler) need deliberate toolchain verification.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly

  # Base images are pinned by digest; Dependabot bumps tag + digest together.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
