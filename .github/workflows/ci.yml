name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore StockData.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format StockData.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build StockData.slnx -c Release --no-restore

      # Non-UTC timezone proves day-grouping never depends on the server's local clock.
      - name: Test
        env:
          TZ: Asia/Tokyo
        run: >
          dotnet test --solution StockData.slnx -c Release --no-build --
          --filter-not-trait "Category=Live"
          --report-xunit-trx
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool run reportgenerator \
            -reports:"**/TestResults/**/*.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"MarkdownSummaryGithub;Html"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: |
            backend/**/TestResults/**/*.trx
            backend/coverage-report/
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
